name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against tracked secret/log files
        run: |
          # .gitignore is the single source of truth: anything it excludes must
          # not also be tracked. Self-maintaining — new ignore rules are covered
          # automatically, and committed templates stay legal as long as the
          # ignore rules do not cover them.
          TRACKED=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$TRACKED" ]; then
            echo "Error: these files are gitignored but still tracked:"
            echo "$TRACKED"
            echo "Fix with: git rm --cached <file>"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
