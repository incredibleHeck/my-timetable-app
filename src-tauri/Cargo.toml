[package]
name = "eduscheduler-pro"
version = "1.0.0"
description = "EduScheduler Pro - School timetable management scheduling, exams, and duty rosters"
authors = ["EduScheduler Team"]
license = "MIT"
repository = "https://github.com/incredibleHeck/my-timetable-app"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
